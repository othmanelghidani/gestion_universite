<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section})">

<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">🎓 Gestion des Étudiants</h2>
    <a class="btn btn-primary" th:href="@{/admin/students/new}">+ Nouvel étudiant</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Filière</th>
            <th>Niveau</th>
            <th>Groupe</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="s : ${students}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.email}"></td>
            <td th:text="${s.filiere}"></td>
            <td th:text="${s.niveau}"></td>
            <td th:text="${s.groupe}"></td>
            <td class="d-flex gap-2">
              <a class="btn btn-sm btn-outline-secondary"
                 th:href="@{/admin/students/{id}/edit(id=${s.id})}">Modifier</a>

              <form th:action="@{/admin/students/{id}/delete(id=${s.id})}" method="post"
                    onsubmit="return confirm('Supprimer cet étudiant ?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="6" class="text-center text-muted">Aucun étudiant</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>

</html>
