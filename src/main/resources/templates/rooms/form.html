<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section})">

<section>
  <h2 class="h4 mb-3">➕ Nouvelle salle</h2>

  <form th:action="@{/admin/rooms}" th:object="${room}" method="post" class="card p-3">

    <div class="mb-3">
      <label class="form-label">Nom de la salle</label>
      <input class="form-control" th:field="*{name}" placeholder="Ex: A101, B203..." required>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-success">Enregistrer</button>
      <a class="btn btn-secondary" th:href="@{/admin/rooms}">Annuler</a>
    </div>
  </form>
</section>
</html>
