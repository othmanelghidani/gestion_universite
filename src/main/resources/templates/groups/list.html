<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Groupes</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#bfa76a' }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-7xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
        <i class="bi bi-people text-gold"></i>
        Gestion des Groupes
      </h2>
      <p class="text-sm text-neutral-500 mt-1">
        Crée, modifie et supprime les groupes utilisés pour l’emploi du temps.
      </p>
    </div>

    <a th:href="@{/admin/groups/new}"
       class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
              bg-white/5 border border-white/10 text-neutral-300
              transition-all duration-300
              hover:border-gold hover:text-gold hover:bg-gold/5
              hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
              active:scale-[0.98]">
      <i class="bi bi-plus-lg transition-transform duration-300 group-hover:rotate-90"></i>
      Nouveau groupe
    </a>
  </div>

  <!-- Alert success -->
  <div th:if="${success}"
       class="rounded-lg border border-gold/20 bg-gold/5 px-4 py-3 text-sm text-gold flex gap-2">
    <i class="bi bi-check-circle-fill"></i>
    <span th:text="${success}"></span>
  </div>

  <!-- Table card -->
  <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">

    <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="bi bi-list-check text-gold"></i>
        <h3 class="text-base font-medium">Liste des groupes</h3>
      </div>
      <div class="text-xs text-neutral-500">
        Actions : modifier / supprimer
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-white/5 text-neutral-400 border-b border-white/10">
        <tr>
          <th class="px-6 py-3 text-left font-medium">ID</th>
          <th class="px-6 py-3 text-left font-medium">Nom</th>
          <th class="px-6 py-3 text-left font-medium">Actions</th>
        </tr>
        </thead>

        <tbody class="divide-y divide-white/5">
        <tr th:each="g : ${groups}" class="hover:bg-white/5 transition">
          <td class="px-6 py-3" th:text="${g.id}">1</td>

          <td class="px-6 py-3">
            <span class="inline-flex items-center gap-2">
              <i class="bi bi-diagram-3 text-neutral-500"></i>
              <span th:text="${g.name}">G1</span>
            </span>
          </td>

          <td class="px-6 py-3">
            <div class="flex flex-wrap gap-3">

              <!-- Edit -->
              <a th:href="@{/admin/groups/{id}/edit(id=${g.id})}"
                 class="group inline-flex items-center gap-1 text-neutral-400 hover:text-gold transition">
                <i class="bi bi-pencil transition-transform duration-300 group-hover:-rotate-6"></i>
                Modifier
              </a>

              <!-- Delete -->
              <form th:action="@{/admin/groups/{id}/delete(id=${g.id})}"
                    method="post"
                    onsubmit="return confirm('Supprimer ce groupe ?');">

                <!-- CSRF (si Spring Security activé) -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <button type="submit"
                        class="group inline-flex items-center gap-1 text-neutral-500 hover:text-red-400 transition">
                  <i class="bi bi-trash transition-transform duration-300 group-hover:scale-110"></i>
                  Supprimer
                </button>
              </form>

            </div>
          </td>
        </tr>

        <!-- Empty -->
        <tr th:if="${#lists.isEmpty(groups)}">
          <td colspan="3" class="px-6 py-8 text-center text-neutral-500">
            <div class="flex flex-col items-center gap-2">
              <i class="bi bi-people text-2xl"></i>
              <span>Aucun groupe</span>
            </div>
          </td>
        </tr>

        </tbody>
      </table>
    </div>

  </div>

</div>

</body>
</html>
