<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Étudiant</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#bfa76a' }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-6xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
                <i class="bi bi-person-badge text-gold"></i>
                Dashboard Étudiant
            </h2>

            <div class="mt-2 flex flex-wrap gap-3 text-sm text-neutral-400">
                <span class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1">
                    <i class="bi bi-envelope"></i>
                    <span th:text="${email}"></span>
                </span>

                <span class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1">
                    <i class="bi bi-people"></i>
                    Groupe : <span class="text-neutral-200" th:text="${group.name}"></span>
                </span>
            </div>
        </div>

        <!-- ✅ Logout en POST (Option A) -->
        <form th:action="@{/logout}" method="post" class="shrink-0">
            <button type="submit"
                    class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
                           bg-white/5 border border-white/10 text-neutral-300
                           transition-all duration-300
                           hover:border-gold hover:text-gold hover:bg-gold/5
                           hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
                           active:scale-[0.98]">
                <i class="bi bi-box-arrow-right transition-transform duration-300 group-hover:translate-x-1"></i>
                Déconnexion
            </button>
        </form>
    </div>

    <!-- Card Table -->
    <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">
        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="bi bi-calendar-week text-gold"></i>
                <h3 class="text-base font-medium">Emploi du temps</h3>
            </div>

            <div class="text-xs text-neutral-500">
                Vue : par séances (triées par jour & heure)
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-white/5 text-neutral-400 border-b border-white/10">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">Jour</th>
                    <th class="px-6 py-3 text-left font-medium">Heure</th>
                    <th class="px-6 py-3 text-left font-medium">Module</th>
                    <th class="px-6 py-3 text-left font-medium">Enseignant</th>
                    <th class="px-6 py-3 text-left font-medium">Salle</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-white/5">
                <tr th:each="s : ${sessions}" class="hover:bg-white/5 transition">
                    <td class="px-6 py-3" th:text="${days[s.dayOfWeek]}"></td>

                    <td class="px-6 py-3">
                        <span class="inline-flex items-center gap-2 rounded-lg border border-white/10 bg-black/30 px-3 py-1">
                            <i class="bi bi-clock text-neutral-500"></i>
                            <span th:text="${s.startTime + ' - ' + s.endTime}"></span>
                        </span>
                    </td>

                    <td class="px-6 py-3">
                        <span class="text-neutral-100" th:text="${s.module.name}"></span>
                    </td>

                    <td class="px-6 py-3 text-neutral-300" th:text="${s.teacher.user.email}"></td>

                    <td class="px-6 py-3">
                        <span class="inline-flex items-center gap-2 rounded-lg border border-white/10 bg-black/30 px-3 py-1">
                            <i class="bi bi-door-open text-neutral-500"></i>
                            <span th:text="${s.room.name}"></span>
                        </span>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(sessions)}">
                    <td colspan="5" class="px-6 py-8 text-center text-neutral-500">
                        <div class="flex flex-col items-center gap-2">
                            <i class="bi bi-calendar-x text-2xl"></i>
                            <span>Aucune séance pour le moment.</span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
