<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::body})}">

<body>
  <h2 class="h4 mb-3" th:text="${mode == 'edit'} ? '✏️ Modifier Séance' : '➕ Créer Séance'"></h2>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card shadow-sm">
    <div class="card-body">

      <form th:object="${sessionDto}"
            th:action="${mode == 'edit'} ? @{/admin/sessions/{id}(id=${sessionDto.id})} : @{/admin/sessions}"
            method="post" class="row g-3">

        <!-- CSRF (si Spring Security activé) -->
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="col-md-3">
          <label class="form-label">Jour (1=Lun … 7=Dim)</label>
          <input type="number" min="1" max="7" class="form-control" th:field="*{dayOfWeek}">
          <div class="text-danger small" th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}"></div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Heure début (HH:MM)</label>
          <input class="form-control" placeholder="08:30" th:field="*{startTime}">
          <div class="text-danger small" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Heure fin (HH:MM)</label>
          <input class="form-control" placeholder="10:00" th:field="*{endTime}">
          <div class="text-danger small" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
        </div>

        <div class="col-md-3">
          <label class="form-label">Salle</label>
          <select class="form-select" th:field="*{roomId}">
            <option value="">— Choisir —</option>
            <option th:each="r : ${rooms}" th:value="${r.id}"
                    th:text="${r.name != null ? r.name : ('Salle #' + r.id)}"></option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
        </div>

        <div class="col-md-4">
          <label class="form-label">Module</label>
          <select class="form-select" th:field="*{moduleId}">
            <option value="">— Choisir —</option>
            <option th:each="m : ${modules}" th:value="${m.id}" th:text="${m.name}"></option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('moduleId')}" th:errors="*{moduleId}"></div>
        </div>

        <div class="col-md-4">
          <label class="form-label">Groupe</label>
          <select class="form-select" th:field="*{groupId}">
            <option value="">— Choisir —</option>
            <option th:each="g : ${groups}" th:value="${g.id}"
                    th:text="${g.name != null ? g.name : ('Groupe #' + g.id)}"></option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('groupId')}" th:errors="*{groupId}"></div>
        </div>

        <div class="col-md-4">
          <label class="form-label">Enseignant</label>
          <select class="form-select" th:field="*{teacherId}">
            <option value="">— Choisir —</option>
            <option th:each="t : ${teachers}" th:value="${t.id}"
                    th:text="${t.user != null ? t.user.email : ('Teacher #' + t.id)}"></option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('teacherId')}" th:errors="*{teacherId}"></div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button class="btn btn-success" type="submit">Enregistrer</button>
          <a class="btn btn-secondary" th:href="@{/admin/sessions}">Annuler</a>
        </div>

      </form>
    </div>
  </div>
</body>
</html>
