<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séance - Formulaire</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = { theme: { extend: { colors: { gold: '#bfa76a' } } } }
  </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-5xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
        <i class="bi bi-calendar2-plus text-gold"></i>
        <span th:text="${mode == 'edit'} ? 'Modifier Séance' : 'Créer Séance'"></span>
      </h2>
      <p class="text-sm text-neutral-500 mt-1">
        Choisis jour, heures, salle, module, groupe et enseignant. Les conflits seront détectés automatiquement.
      </p>
    </div>

    <a th:href="@{/admin/sessions}"
       class="inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
              bg-white/5 border border-white/10 text-neutral-300
              hover:border-gold hover:text-gold hover:bg-gold/5
              transition-all duration-300">
      <i class="bi bi-arrow-left"></i>
      Retour
    </a>
  </div>

  <!-- Error -->
  <div th:if="${error}"
       class="rounded-lg border border-red-500/20 bg-red-500/5 px-4 py-3 text-sm text-red-300 flex gap-2">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span th:text="${error}"></span>
  </div>

  <!-- Card -->
  <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">
    <div class="p-6">

      <form th:object="${sessionDto}"
            th:action="${mode == 'edit'} ? @{/admin/sessions/{id}(id=${sessionDto.id})} : @{/admin/sessions}"
            method="post"
            class="grid grid-cols-1 md:grid-cols-12 gap-5">

        <!-- CSRF -->
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- Jour -->
        <div class="md:col-span-3">
          <label class="block text-sm text-neutral-400 mb-2">Jour (1=Lun … 7=Dim)</label>
          <input type="number" min="1" max="7" th:field="*{dayOfWeek}"
                 class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                        text-neutral-100 outline-none
                        focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('dayOfWeek')}" th:errors="*{dayOfWeek}"></div>
        </div>

        <!-- Début -->
        <div class="md:col-span-3">
          <label class="block text-sm text-neutral-400 mb-2">Heure début (HH:MM)</label>
          <input th:field="*{startTime}" placeholder="08:30"
                 class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                        text-neutral-100 placeholder-neutral-600 outline-none
                        focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}"></div>
        </div>

        <!-- Fin -->
        <div class="md:col-span-3">
          <label class="block text-sm text-neutral-400 mb-2">Heure fin (HH:MM)</label>
          <input th:field="*{endTime}" placeholder="10:00"
                 class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                        text-neutral-100 placeholder-neutral-600 outline-none
                        focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}"></div>
        </div>

        <!-- Salle -->
        <div class="md:col-span-3">
          <label class="block text-sm text-neutral-400 mb-2">Salle</label>
          <select th:field="*{roomId}"
                  class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                         text-neutral-100 outline-none
                         focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
            <option value="">— Choisir —</option>
            <option th:each="r : ${rooms}" th:value="${r.id}"
                    th:text="${r.name != null ? r.name : ('Salle #' + r.id)}"></option>
          </select>
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('roomId')}" th:errors="*{roomId}"></div>
        </div>

        <!-- Module -->
        <div class="md:col-span-4">
          <label class="block text-sm text-neutral-400 mb-2">Module</label>
          <select th:field="*{moduleId}"
                  class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                         text-neutral-100 outline-none
                         focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
            <option value="">— Choisir —</option>
            <option th:each="m : ${modules}" th:value="${m.id}" th:text="${m.name}"></option>
          </select>
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('moduleId')}" th:errors="*{moduleId}"></div>
        </div>

        <!-- Groupe -->
        <div class="md:col-span-4">
          <label class="block text-sm text-neutral-400 mb-2">Groupe</label>
          <select th:field="*{groupId}"
                  class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                         text-neutral-100 outline-none
                         focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
            <option value="">— Choisir —</option>
            <option th:each="g : ${groups}" th:value="${g.id}"
                    th:text="${g.name != null ? g.name : ('Groupe #' + g.id)}"></option>
          </select>
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('groupId')}" th:errors="*{groupId}"></div>
        </div>

        <!-- Enseignant (email + grade si dispo) -->
        <div class="md:col-span-4">
          <label class="block text-sm text-neutral-400 mb-2">Enseignant</label>
          <select th:field="*{teacherId}"
                  class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                         text-neutral-100 outline-none
                         focus:border-gold focus:ring-1 focus:ring-gold/20 transition">
            <option value="">— Choisir —</option>
            <option th:each="t : ${teachers}"
                    th:value="${t.id}"
                    th:text="${t.user != null ? (t.user.email + (t.grade != null ? (' — ' + t.grade) : '')) : ('Teacher #' + t.id)}">
            </option>
          </select>
          <div class="mt-2 text-xs text-red-300"
               th:if="${#fields.hasErrors('teacherId')}" th:errors="*{teacherId}"></div>
        </div>

        <!-- Actions -->
        <div class="md:col-span-12 flex flex-wrap gap-3 pt-2">
          <button type="submit"
                  class="group inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium
                         bg-white/5 border border-white/10 text-neutral-200
                         transition-all duration-300
                         hover:border-gold hover:text-gold hover:bg-gold/5
                         hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
                         active:scale-[0.98]">
            <i class="bi bi-check2-circle transition-transform duration-300 group-hover:scale-110"></i>
            Enregistrer
          </button>

          <a th:href="@{/admin/sessions}"
             class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium
                    border border-white/10 text-neutral-300
                    hover:border-gold hover:text-gold hover:bg-gold/5
                    transition-all duration-300">
            <i class="bi bi-x-circle"></i>
            Annuler
          </a>
        </div>

      </form>
    </div>
  </div>

</div>

</body>
</html>
