<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section})">

<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">🗓️ Emploi du temps — Séances</h2>
    <a class="btn btn-primary" th:href="@{/admin/sessions/new}">+ Nouvelle séance</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead>
          <tr>
            <th>ID</th>
            <th>Jour</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Module</th>
            <th>Groupe</th>
            <th>Enseignant</th>
            <th>Salle</th>
            <th>Actions</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="s : ${sessions}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.dayOfWeek}"></td>
            <td th:text="${s.startTime}"></td>
            <td th:text="${s.endTime}"></td>

            <td th:text="${s.moduleName != null ? s.moduleName : ('#' + s.moduleId)}"></td>

            <td th:text="${s.groupName != null ? s.groupName : ('#' + s.groupId)}"></td>

            <td th:text="${s.teacherEmail != null
                          ? (s.teacherEmail + (s.teacherGrade != null ? (' — ' + s.teacherGrade) : ''))
                          : ('#' + s.teacherId)}"></td>

            <td th:text="${s.roomName != null ? s.roomName : ('#' + s.roomId)}"></td>

            <td class="d-flex gap-2 flex-wrap">
              <a class="btn btn-sm btn-outline-secondary"
                 th:href="@{/admin/sessions/{id}/edit(id=${s.id})}">Modifier</a>

              <form th:action="@{/admin/sessions/{id}/delete(id=${s.id})}"
                    method="post"
                    onsubmit="return confirm('Supprimer cette séance ?');">
                <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(sessions)}">
            <td colspan="9" class="text-center text-muted">Aucune séance</td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="text-muted small">
        ✅ Les IDs restent dans le DTO pour le form, mais la liste affiche des noms/emails.
      </div>
    </div>
  </div>
</section>

</html>
