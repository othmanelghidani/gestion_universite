<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emploi du temps — Séances</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = { theme: { extend: { colors: { gold: '#bfa76a' } } } }
  </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-7xl mx-auto space-y-6">

  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
        <i class="bi bi-calendar-week text-gold"></i>
        Emploi du temps — Séances
      </h2>
      <p class="text-sm text-neutral-500 mt-1">
        Jours en texte • Noms réels • Email enseignant
      </p>
    </div>

    <a th:href="@{/admin/sessions/new}"
       class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
              bg-white/5 border border-white/10 text-neutral-300
              transition-all duration-300
              hover:border-gold hover:text-gold hover:bg-gold/5
              hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
              active:scale-[0.98]">
      <i class="bi bi-plus-lg transition-transform duration-300 group-hover:rotate-90"></i>
      Nouvelle séance
    </a>
  </div>

  <div th:if="${success}"
       class="rounded-lg border border-gold/20 bg-gold/5 px-4 py-3 text-sm text-gold flex gap-2">
    <i class="bi bi-check-circle-fill"></i>
    <span th:text="${success}"></span>
  </div>

  <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">

    <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="bi bi-list-check text-gold"></i>
        <h3 class="text-base font-medium">Liste des séances</h3>
      </div>
      
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-white/5 text-neutral-400 border-b border-white/10">
        <tr>
          <th class="px-6 py-3 text-left font-medium">ID</th>
          <th class="px-6 py-3 text-left font-medium">Jour</th>
          <th class="px-6 py-3 text-left font-medium">Heure</th>
          <th class="px-6 py-3 text-left font-medium">Module</th>
          <th class="px-6 py-3 text-left font-medium">Groupe</th>
          <th class="px-6 py-3 text-left font-medium">Enseignant</th>
          <th class="px-6 py-3 text-left font-medium">Salle</th>
          <th class="px-6 py-3 text-left font-medium">Actions</th>
        </tr>
        </thead>

        <tbody class="divide-y divide-white/5">
        <tr th:each="s : ${sessions}" class="hover:bg-white/5 transition">
          <td class="px-6 py-3" th:text="${s.id}"></td>

          <td class="px-6 py-3">
            <span class="inline-flex items-center gap-2 rounded-lg border border-white/10 bg-black/30 px-3 py-1">
              <i class="bi bi-calendar3 text-neutral-500"></i>
              <span th:switch="${s.dayOfWeek}">
                <span th:case="1">Lundi</span>
                <span th:case="2">Mardi</span>
                <span th:case="3">Mercredi</span>
                <span th:case="4">Jeudi</span>
                <span th:case="5">Vendredi</span>
                <span th:case="6">Samedi</span>
                <span th:case="7">Dimanche</span>
                <span th:case="*">—</span>
              </span>
            </span>
          </td>

          <td class="px-6 py-3">
            <span class="inline-flex items-center gap-2 rounded-lg border border-white/10 bg-black/30 px-3 py-1">
              <i class="bi bi-clock text-neutral-500"></i>
              <span th:text="${s.startTime + ' - ' + s.endTime}"></span>
            </span>
          </td>

          <td class="px-6 py-3" th:text="${s.moduleName}"></td>
          <td class="px-6 py-3" th:text="${s.groupName}"></td>

          <td class="px-6 py-3">
            <span class="inline-flex items-center gap-2">
              <i class="bi bi-envelope text-neutral-500"></i>
              <span th:text="${s.teacherEmail}"></span>
            </span>
            <span class="text-neutral-500" th:if="${s.teacherGrade != null}" th:text="${' — ' + s.teacherGrade}"></span>
          </td>

          <td class="px-6 py-3">
            <span class="inline-flex items-center gap-2 rounded-lg border border-white/10 bg-black/30 px-3 py-1">
              <i class="bi bi-door-open text-neutral-500"></i>
              <span th:text="${s.roomName}"></span>
            </span>
          </td>

          <td class="px-6 py-3">
            <div class="flex flex-wrap gap-3">
              <a th:href="@{/admin/sessions/{id}/edit(id=${s.id})}"
                 class="group inline-flex items-center gap-1 text-neutral-400 hover:text-gold transition">
                <i class="bi bi-pencil transition-transform duration-300 group-hover:-rotate-6"></i>
                Modifier
              </a>

              <form th:action="@{/admin/sessions/{id}/delete(id=${s.id})}"
                    method="post"
                    onsubmit="return confirm('Supprimer cette séance ?');">
                <button type="submit"
                        class="group inline-flex items-center gap-1 text-neutral-500 hover:text-red-400 transition">
                  <i class="bi bi-trash transition-transform duration-300 group-hover:scale-110"></i>
                  Supprimer
                </button>
              </form>
            </div>
          </td>
        </tr>

        <tr th:if="${#lists.isEmpty(sessions)}">
          <td colspan="8" class="px-6 py-8 text-center text-neutral-500">
            <div class="flex flex-col items-center gap-2">
              <i class="bi bi-calendar-x text-2xl"></i>
              <span>Aucune séance</span>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

</body>
</html>
