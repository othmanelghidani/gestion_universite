<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold: '#bfa76a' }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-7xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
        <i class="bi bi-shield-lock text-gold"></i>
        Dashboard Admin
      </h2>
      <p class="text-sm text-neutral-500 mt-1">
        Connecté en tant que : <span class="text-neutral-300" th:text="${email}"></span>
      </p>
    </div>

    <a th:href="@{/logout}"
       class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
              bg-white/5 border border-white/10 text-neutral-300
              transition-all duration-300
              hover:border-red-400 hover:text-red-300 hover:bg-red-500/5
              active:scale-[0.98]">
      <i class="bi bi-box-arrow-right"></i>
      Déconnexion
    </a>
  </div>

  <!-- Cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

    <!-- Students -->
    <a th:href="@{/admin/students}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-mortarboard text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Étudiants</div>
            <div class="text-sm text-neutral-500">CRUD des profils étudiants</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

    <!-- Teachers -->
    <a th:href="@{/admin/teachers}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-person-video3 text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Enseignants</div>
            <div class="text-sm text-neutral-500">CRUD des enseignants</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

    <!-- Rooms -->
    <a th:href="@{/admin/rooms}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-door-open text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Salles</div>
            <div class="text-sm text-neutral-500">Gestion des salles</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

    <!-- Groups -->
    <a th:href="@{/admin/groups}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-people text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Groupes</div>
            <div class="text-sm text-neutral-500">Gestion des groupes</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

    <!-- Modules -->
    <a th:href="@{/admin/modules}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-book text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Modules</div>
            <div class="text-sm text-neutral-500">Gestion des modules</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

    <!-- Sessions -->
    <a th:href="@{/admin/sessions}"
       class="group rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md p-5
              hover:border-gold hover:bg-gold/5 transition-all duration-300
              hover:shadow-[0_0_20px_rgba(191,167,106,0.12)]">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-11 w-11 rounded-xl bg-black/30 border border-white/10 flex items-center justify-center">
            <i class="bi bi-calendar-week text-gold text-xl"></i>
          </div>
          <div>
            <div class="font-medium">Séances</div>
            <div class="text-sm text-neutral-500">Emploi du temps + conflits</div>
          </div>
        </div>
        <i class="bi bi-arrow-right-short text-2xl text-neutral-500 group-hover:text-gold transition"></i>
      </div>
    </a>

  </div>

 
  

</div>

</body>
</html>
