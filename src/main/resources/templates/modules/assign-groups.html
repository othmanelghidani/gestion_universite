<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affecter Groupes</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: '#bfa76a' } } }
    }
  </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-5xl mx-auto space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4">
    <div>
      <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
        <i class="bi bi-people text-gold"></i>
        Affecter des groupes au module :
        <span class="text-gold" th:text="${module.name}"></span>
      </h2>
      <p class="text-sm text-neutral-500 mt-1">
        Coche les groupes qui suivent ce module.
      </p>
    </div>

    <a th:href="@{/admin/modules}"
       class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
              bg-white/5 border border-white/10 text-neutral-300
              transition-all duration-300
              hover:border-gold hover:text-gold hover:bg-gold/5
              hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
              active:scale-[0.98]">
      <i class="bi bi-arrow-left"></i>
      Retour
    </a>
  </div>

  <!-- Card -->
  <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">

    <div class="px-6 py-4 border-b border-white/10 flex items-center gap-2">
      <i class="bi bi-check2-square text-gold"></i>
      <h3 class="text-base font-medium">Sélection des groupes</h3>
    </div>

    <form th:action="@{/admin/modules/{id}/groups(id=${module.id})}"
          th:object="${dto}"
          method="post"
          class="p-6 space-y-5">

      <input type="hidden" th:field="*{moduleId}">

      <div th:if="${#lists.isEmpty(groups)}"
           class="rounded-lg border border-yellow-500/20 bg-yellow-500/5 px-4 py-3 text-sm text-yellow-200 flex gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span>Aucun groupe trouvé. Crée d’abord des groupes.</span>
      </div>

      <div class="space-y-2">
        <label th:each="g : ${groups}"
               class="flex items-center justify-between gap-3 rounded-xl border border-white/10 bg-black/20 px-4 py-3
                      hover:border-gold/40 hover:bg-gold/5 transition cursor-pointer">

          <div class="flex items-center gap-3">
            <input class="h-4 w-4 accent-[#bfa76a]"
                   type="checkbox"
                   th:field="*{groupIds}"
                   th:value="${g.id}">
            <span class="inline-flex items-center gap-2">
              <i class="bi bi-diagram-3 text-neutral-500"></i>
              <span th:text="${g.name != null ? g.name : ('Groupe #' + g.id)}"></span>
            </span>
          </div>

          <span class="text-xs text-neutral-500">ID:
            <span th:text="${g.id}"></span>
          </span>
        </label>
      </div>

      <div class="flex flex-wrap gap-4 pt-2">
        <button type="submit"
                class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-semibold
                       bg-white/5 border border-white/10 text-neutral-300
                       transition-all duration-300
                       hover:border-gold hover:text-gold hover:bg-gold/5
                       hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
                       active:scale-[0.98]">
          <i class="bi bi-check2-circle transition-transform duration-300 group-hover:scale-110"></i>
          Enregistrer
        </button>

        <a th:href="@{/admin/modules}"
           class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
                  bg-white/5 border border-white/10 text-neutral-300
                  transition-all duration-300
                  hover:border-white/20 hover:text-neutral-100 hover:bg-white/10
                  active:scale-[0.98]">
          <i class="bi bi-x-circle"></i>
          Annuler
        </a>
      </div>

    </form>
  </div>

</div>

</body>
</html>
