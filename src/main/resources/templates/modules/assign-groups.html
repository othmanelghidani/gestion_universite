<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section})">

<section>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h4 mb-0">
      👥 Affecter des groupes au module :
      <span th:text="${module.name}"></span>
    </h2>
    <a class="btn btn-secondary" th:href="@{/admin/modules}">Retour</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <form th:action="@{/admin/modules/{id}/groups(id=${module.id})}"
            th:object="${dto}"
            method="post">

        <input type="hidden" th:field="*{moduleId}">

        <div class="row">
          <div class="col-md-8">

            <div th:if="${#lists.isEmpty(groups)}" class="alert alert-warning">
              Aucun groupe trouvé. Crée d’abord des groupes.
            </div>

            <div th:each="g : ${groups}" class="form-check mb-2">
              <input class="form-check-input"
                     type="checkbox"
                     th:field="*{groupIds}"
                     th:value="${g.id}">
              <label class="form-check-label">
                <span th:text="${g.name != null ? g.name : ('Groupe #' + g.id)}"></span>
              </label>
            </div>

          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-success" type="submit">Enregistrer</button>
          <a class="btn btn-outline-secondary" th:href="@{/admin/modules}">Annuler</a>
        </div>

      </form>
    </div>
  </div>
</section>

</html>
