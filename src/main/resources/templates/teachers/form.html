<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enseignant - Formulaire</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#bfa76a' }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-start justify-between gap-4">
        <div>
            <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
                <i class="bi bi-person-video3 text-gold"></i>
                <span th:text="${mode == 'edit'} ? 'Modifier Enseignant' : 'Nouvel Enseignant'"></span>
            </h2>
            <p class="text-sm text-neutral-500 mt-1">
                Renseigne les informations de l’enseignant. L’email sera utilisé pour la connexion.
            </p>
        </div>

        <a th:href="@{/admin/teachers}"
           class="inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
                  bg-white/5 border border-white/10 text-neutral-300
                  hover:border-gold hover:text-gold hover:bg-gold/5
                  transition-all duration-300">
            <i class="bi bi-arrow-left"></i>
            Retour
        </a>
    </div>

    <!-- Error -->
    <div th:if="${errorMessage}"
         class="rounded-lg border border-red-500/20 bg-red-500/5 px-4 py-3 text-sm text-red-300 flex gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Card -->
    <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">
        <div class="p-6">

            <form th:object="${teacherDto}"
                  th:action="${mode == 'edit'} ? @{/admin/teachers/{id}(id=${teacherDto.id})} : @{/admin/teachers}"
                  method="post"
                  class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <!-- CSRF (si Spring Security activé) -->
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Email -->
                <div>
                    <label class="block text-sm text-neutral-400 mb-2">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input class="w-full rounded-xl bg-black/40 border border-white/10 pl-10 pr-3 py-2.5
                                      text-neutral-100 placeholder-neutral-600 outline-none
                                      focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                               th:field="*{email}" placeholder="ex: prof@univ.local">
                    </div>
                    <div class="mt-2 text-xs text-red-300"
                         th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm text-neutral-400 mb-2">Mot de passe</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password"
                               class="w-full rounded-xl bg-black/40 border border-white/10 pl-10 pr-3 py-2.5
                                      text-neutral-100 placeholder-neutral-600 outline-none
                                      focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                               th:field="*{password}"
                               placeholder="(laisser vide en modification si tu as prévu ça)">
                    </div>
                    <div class="mt-2 text-xs text-red-300"
                         th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- Grade -->
                <div>
                    <label class="block text-sm text-neutral-400 mb-2">Grade</label>
                    <input class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                                  text-neutral-100 placeholder-neutral-600 outline-none
                                  focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                           th:field="*{grade}" placeholder="ex: Professeur, Maître de conf...">
                    <div class="mt-2 text-xs text-red-300"
                         th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></div>
                </div>

                <!-- Specialite -->
                <div>
                    <label class="block text-sm text-neutral-400 mb-2">Spécialité</label>
                    <input class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                                  text-neutral-100 placeholder-neutral-600 outline-none
                                  focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                           th:field="*{specialite}" placeholder="ex: IA, Réseaux, Maths...">
                    <div class="mt-2 text-xs text-red-300"
                         th:if="${#fields.hasErrors('specialite')}" th:errors="*{specialite}"></div>
                </div>

                <!-- Competences -->
                <div class="md:col-span-2">
                    <label class="block text-sm text-neutral-400 mb-2">Compétences</label>
                    <textarea rows="3"
                              class="w-full rounded-xl bg-black/40 border border-white/10 px-3 py-2.5
                                     text-neutral-100 placeholder-neutral-600 outline-none
                                     focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                              th:field="*{competences}" placeholder="ex: Java, Spring, Sécurité..."></textarea>
                    <div class="mt-2 text-xs text-red-300"
                         th:if="${#fields.hasErrors('competences')}" th:errors="*{competences}"></div>
                </div>

                <!-- Actions -->
                <div class="md:col-span-2 flex flex-wrap gap-3 pt-2">
                    <button type="submit"
                            class="group inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium
                                   bg-white/5 border border-white/10 text-neutral-200
                                   transition-all duration-300
                                   hover:border-gold hover:text-gold hover:bg-gold/5
                                   hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
                                   active:scale-[0.98]">
                        <i class="bi bi-check2-circle transition-transform duration-300 group-hover:scale-110"></i>
                        Enregistrer
                    </button>

                    <a th:href="@{/admin/teachers}"
                       class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium
                              border border-white/10 text-neutral-300
                              hover:border-gold hover:text-gold hover:bg-gold/5
                              transition-all duration-300">
                        <i class="bi bi-x-circle"></i>
                        Annuler
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>

</body>
</html>
