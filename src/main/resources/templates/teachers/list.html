<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Enseignants</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#bfa76a' }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200 p-8">

<div class="max-w-7xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-medium tracking-wide flex items-center gap-2">
                <i class="bi bi-person-video3 text-gold"></i>
                Gestion des Enseignants
            </h2>
            <p class="text-sm text-neutral-500 mt-1">
                Crée, modifie et supprime les enseignants. Les comptes sont utilisés pour l’accès au dashboard.
            </p>
        </div>

        <a th:href="@{/admin/teachers/new}"
           class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl font-medium
                  bg-white/5 border border-white/10 text-neutral-300
                  transition-all duration-300
                  hover:border-gold hover:text-gold hover:bg-gold/5
                  hover:shadow-[0_0_20px_rgba(191,167,106,0.15)]
                  active:scale-[0.98]">
            <i class="bi bi-plus-lg transition-transform duration-300 group-hover:rotate-90"></i>
            Nouvel enseignant
        </a>
    </div>

    <!-- Alerts -->
    <div th:if="${successMessage}"
         class="rounded-lg border border-gold/20 bg-gold/5 px-4 py-3 text-sm text-gold flex gap-2">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}"
         class="rounded-lg border border-red-500/20 bg-red-500/5 px-4 py-3 text-sm text-red-300 flex gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Table card -->
    <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md overflow-hidden">

        <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="bi bi-list-check text-gold"></i>
                <h3 class="text-base font-medium">Liste des enseignants</h3>
            </div>
            <div class="text-xs text-neutral-500">
                Actions : modifier / supprimer
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-white/5 text-neutral-400 border-b border-white/10">
                <tr>
                    <th class="px-6 py-3 text-left font-medium">ID</th>
                    <th class="px-6 py-3 text-left font-medium">Email</th>
                    <th class="px-6 py-3 text-left font-medium">Grade</th>
                    <th class="px-6 py-3 text-left font-medium">Spécialité</th>
                    <th class="px-6 py-3 text-left font-medium">Compétences</th>
                    <th class="px-6 py-3 text-left font-medium">Actions</th>
                </tr>
                </thead>

                <tbody class="divide-y divide-white/5">
                <tr th:each="t : ${teachers}" class="hover:bg-white/5 transition">
                    <td class="px-6 py-3" th:text="${t.id}">1</td>

                    <td class="px-6 py-3">
                        <span class="inline-flex items-center gap-2">
                            <i class="bi bi-envelope text-neutral-500"></i>
                            <span th:text="${t.user != null ? t.user.email : ''}">email</span>
                        </span>
                    </td>

                    <td class="px-6 py-3" th:text="${t.grade}">grade</td>
                    <td class="px-6 py-3" th:text="${t.specialite}">spec</td>

                    <td class="px-6 py-3">
                        <div class="max-w-md text-neutral-300 truncate" th:text="${t.competences}">comp</div>
                    </td>

                    <td class="px-6 py-3">
                        <div class="flex flex-wrap gap-3">

                            <!-- Edit -->
                            <a th:href="@{/admin/teachers/{id}/edit(id=${t.id})}"
                               class="group inline-flex items-center gap-1 text-neutral-400 hover:text-gold transition">
                                <i class="bi bi-pencil transition-transform duration-300 group-hover:-rotate-6"></i>
                                Modifier
                            </a>

                            <!-- Delete -->
                            <form th:action="@{/admin/teachers/{id}/delete(id=${t.id})}"
                                  method="post"
                                  onsubmit="return confirm('Supprimer cet enseignant ?');">

                                <!-- CSRF (si Spring Security activé) -->
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <button type="submit"
                                        class="group inline-flex items-center gap-1 text-neutral-500 hover:text-red-400 transition">
                                    <i class="bi bi-trash transition-transform duration-300 group-hover:scale-110"></i>
                                    Supprimer
                                </button>
                            </form>

                        </div>
                    </td>
                </tr>

                <!-- Empty -->
                <tr th:if="${#lists.isEmpty(teachers)}">
                    <td colspan="6" class="px-6 py-8 text-center text-neutral-500">
                        <div class="flex flex-col items-center gap-2">
                            <i class="bi bi-person-x text-2xl"></i>
                            <span>Aucun enseignant</span>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
