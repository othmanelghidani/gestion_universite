<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - University Gest</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#bfa76a'   // doré doux (pas jaune flashy)
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-[#0a0a0a] text-neutral-200">

<!-- Background très subtil -->
<div class="fixed inset-0 -z-10">
    <div class="absolute inset-0 bg-gradient-to-br from-black via-[#0d0d0d] to-black"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 h-96 w-96 rounded-full bg-gold/5 blur-3xl"></div>
</div>

<div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="h-11 w-11 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center">
                    <i class="bi bi-mortarboard-fill text-gold"></i>
                </div>
                <div>
                    <div class="text-xs uppercase tracking-widest text-neutral-500">University Gest</div>
                    <div class="text-lg font-medium text-neutral-200">Connexion</div>
                </div>
            </div>

            <a th:href="@{/}"
               class="inline-flex items-center gap-2 text-sm text-neutral-400 hover:text-gold transition">
                <i class="bi bi-house-door"></i>
                Accueil
            </a>
        </div>

        <!-- Card -->
        <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-md">
            <div class="p-6">

                <!-- Error -->
                <div th:if="${param.error}"
                     class="mb-4 rounded-lg border border-red-500/20 bg-red-500/5 px-4 py-3 text-sm text-red-300 flex gap-2">
                    <i class="bi bi-exclamation-triangle-fill mt-0.5"></i>
                    <div>Email ou mot de passe incorrect.</div>
                </div>

                <!-- Logout -->
                <div th:if="${param.logout}"
                     class="mb-4 rounded-lg border border-gold/20 bg-gold/5 px-4 py-3 text-sm text-gold flex gap-2">
                    <i class="bi bi-check-circle-fill mt-0.5"></i>
                    <div>Déconnecté avec succès.</div>
                </div>

                <!-- Form -->
                <form th:action="@{/login}" method="post" class="space-y-5">

                    <div>
                        <label class="block text-sm text-neutral-400 mb-2">Email</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input
                                type="email"
                                name="email"
                                required
                                placeholder="ex: prof@univ.ma"
                                class="w-full rounded-xl bg-black/40 border border-white/10 pl-10 pr-3 py-2.5
                                       text-neutral-100 placeholder-neutral-600 outline-none
                                       focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                            />
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm text-neutral-400 mb-2">Mot de passe</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input
                                type="password"
                                name="password"
                                required
                                placeholder="Votre mot de passe"
                                class="w-full rounded-xl bg-black/40 border border-white/10 pl-10 pr-3 py-2.5
                                       text-neutral-100 placeholder-neutral-600 outline-none
                                       focus:border-gold focus:ring-1 focus:ring-gold/20 transition"
                            />
                        </div>
                    </div>

                    <button type="submit"
                            class="w-full py-2.5 rounded-xl font-medium
                                   bg-white/5 border border-white/10 text-neutral-200
                                   hover:border-gold hover:text-gold transition">
                        Se connecter
                    </button>
                </form>

                <!-- Hint -->
                <div class="mt-5 text-xs text-neutral-500 flex gap-2">
                    <i class="bi bi-info-circle"></i>
                    <p>Les comptes sont créés par l’administrateur.</p>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
